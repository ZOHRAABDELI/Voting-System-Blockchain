services:
  - type: web
    name: voting-blockchain-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -c gunicorn_config.py app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DEBUG
        value: False
    disk:
      name: blockchain-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
